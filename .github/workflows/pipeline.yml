name: Dispatcher

on:
  push:
    branches:
      - dev
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: mvn clean compile

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Tests
        run: mvn test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up jdk and write settings.xml
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: ${{ vars.MAVEN_CENTRAL_USERNAME }}
          server-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}


      - name: Write settings-security.xml
        shell: bash
        env:
          MAVEN_CENTRAL_MASTER_PASSWORD: ${{ secrets.MAVEN_CENTRAL_MASTER_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          echo "<settingsSecurity><master>${MAVEN_CENTRAL_MASTER_PASSWORD}</master></settingsSecurity>" > ~/.m2/settings-security.xml
          chmod 600 ~/.m2/settings-security.xml        

      - name: Release Snapshot
        if: github.ref == 'refs/heads/dev'
        env:
          MAVEN_GPG_KEY: ${{ secrets.GPG_SECRET_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn deploy -X -Dgpg.signer=bc

      - name: Release Production
        if: github.ref == 'refs/heads/prod'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_SECRET_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          git config --global user.email "dev@bronsenproject.nl"
          git config --global user.name "Dev @ BronsEnProject"
          mvn release:prepare release:perform -B
